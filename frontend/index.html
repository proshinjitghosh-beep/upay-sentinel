<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upay Sentinel · Risk Command Center</title>
<style>
:root{--bg:#f2f5fa;--panel:#fff;--text:#17243b;--muted:#64748b;--line:#dce3ef;--blue:#315bea;--red:#df465e;--green:#13856b;--yellow:#d68c14;--soft:#edf2ff;--shadow:0 8px 28px #162d5c08}body.dark{--bg:#0d1524;--panel:#172235;--text:#ecf2ff;--muted:#a4b3c9;--line:#2b3a53;--soft:#202f49;--shadow:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8ba7ff;outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:226px;background:#111e35;color:#fff;padding:27px 18px;display:flex;flex-direction:column;z-index:2}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.brand span{color:#ffd061}.tagline{color:#97abc8;font-size:11px;margin:5px 0 27px;text-transform:uppercase;letter-spacing:1.4px}nav button{display:block;width:100%;border:0;color:#b7c7df;background:none;padding:12px 14px;margin-bottom:6px;border-radius:9px;text-align:left}nav button.active,nav button:hover{background:#2b4268;color:#fff}.asidefoot{margin-top:auto;color:#97abc8;font-size:12px}.main{margin-left:226px;padding:26px 34px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}h1{font-size:26px;margin:0;letter-spacing:-.7px}h2{font-size:17px;margin:0 0 13px}h3{font-size:14px;margin:20px 0 9px}p{margin:8px 0}small,.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.pill{border-radius:20px;padding:3px 10px;background:var(--soft);font-size:12px;font-weight:650}.HOLD{color:var(--red)}.WATCH{color:var(--yellow)}.CLEAR{color:var(--green)}.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 13px;border-radius:8px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red)}.btn:hover{filter:brightness(.95)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:var(--shadow)}.card b{font-size:30px;display:block;margin-top:5px;letter-spacing:-1px}.card small{font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.cases{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.queue{max-height:710px;overflow:auto;margin-top:14px}.item{border:0;background:none;color:var(--text);text-align:left;display:block;width:100%;padding:14px 9px;border-bottom:1px solid var(--line)}.item.selected{background:var(--soft);border-radius:8px}.score{font-size:40px;font-weight:850;line-height:1.1}.line{height:7px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}.line span{height:100%;display:block;background:var(--blue)}input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 10px;max-width:100%}textarea{width:100%;min-height:65px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field{margin-bottom:14px}.field input,.field select{width:100%}.notice{border:1px solid var(--line);border-left:4px solid var(--blue);padding:12px 15px;background:var(--soft);border-radius:7px;margin:13px 0;font-size:13px}.notice.warn{border-left-color:var(--yellow)}.notice.error{border-left-color:var(--red)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}.scroll{overflow:auto}ul{padding-left:20px}svg{width:100%;height:auto;display:block;min-height:210px}.mapbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}svg text{font-family:system-ui;fill:var(--text)}svg .node{cursor:pointer}.timeline{max-height:250px;overflow:auto}.timeline .event{padding:8px 0 8px 13px;border-left:2px solid var(--line)}.tabs{display:flex;gap:7px}.tabs button.active{background:var(--blue);color:white}.badge{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}.empty{color:var(--muted);padding:35px;text-align:center}.phone{max-width:365px;margin:0 auto;border:6px solid var(--line);border-radius:28px;padding:25px;background:var(--panel)}#toast{position:fixed;bottom:20px;right:25px;background:#22395d;color:white;padding:12px 20px;border-radius:8px;max-width:450px;z-index:10;display:none}.legend{display:flex;gap:15px;font-size:11px;color:var(--muted);margin:8px 0}.legend i{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px}.kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.stack{margin-bottom:20px}.contrib{height:15px;display:flex;border-radius:5px;overflow:hidden;background:var(--line);margin:13px 0}.contrib span{display:block;height:100%}#agentinfo:empty{display:none}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.cases{grid-template-columns:240px minmax(0,1fr)}.main{padding:22px}.grid{grid-template-columns:1fr}}@media(max-width:760px){aside{position:static;width:auto;padding:15px}.tagline,.asidefoot{display:none}nav{display:flex;overflow:auto;margin-top:10px}nav button{white-space:nowrap;width:auto;padding:8px}.main{margin:0;padding:16px}.cases{grid-template-columns:1fr}.queue{max-height:260px}header{align-items:flex-start}.cards{gap:10px}.card{padding:14px}h1{font-size:22px}}
</style></head><body><aside><div class="brand">upay <span>sentinel</span></div><div class="tagline">Trust & Risk Intelligence</div><nav id="nav"></nav><div class="asidefoot">Synthetic data only<br>No real money or user tracking<br><br>Version 2.0 · Offline UI</div></aside><main class="main"><header><div><div class="kicker">Risk Command Center</div><h1 id="heading">Overview</h1></div><div class="row"><span class="pill" id="connection">Connecting…</span><select id="scope" aria-label="Data scope"><option value="batch">Batch evidence</option><option value="replay">Live replay</option></select><button class="btn" id="theme">Night mode</button></div></header><div id="error"></div><div id="content"><div class="empty">Loading synthetic evidence…</div></div></main><div id="toast" role="status"></div>
<script>
'use strict';
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), tk=x=>'৳'+Math.round(x||0).toLocaleString('en-IN'), pct=x=>(100*(x||0)).toFixed(1)+'%', time=x=>new Date(x*1000).toLocaleString('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',second:'2-digit'}), fulltime=x=>new Date(x).toLocaleString('en-GB',{timeZone:'Asia/Dhaka'});
const pages=['Overview','Alert Queue','Money Trail','Live Monitor','Scam Simulator','Customer View','Audit Log','Evidence'];
let page='Overview',scope='batch',selected=null,summary=null,alerts=[],detail=null,replay=null,trailMode='graph',filter='ALL',search='',playing=false,timer=null,busy=false;
const params=new URLSearchParams(location.search),api=(params.get('api')||'').replace(/\/$/,''),key=params.get('key')||'';
async function call(path,body){const r=await fetch(api+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(key?{'X-API-Key':key}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
const scoped=p=>p+(p.includes('?')?'&':'?')+'scope='+scope;
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
function fail(e){$('error').innerHTML='<div class="notice error">'+esc(e.message)+' <button class="btn" onclick="refresh()">Retry</button></div>';stop()}
function color(r){return r>=85?'var(--red)':r>=60?'var(--yellow)':'var(--green)'}
function stop(){playing=false;clearTimeout(timer);timer=null}
function nav(){ $('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{stop();page=b.dataset.page;render().catch(fail)});$('heading').textContent=page;}
async function refresh(){try{$('error').innerHTML='';[summary,alerts,replay]=await Promise.all([call(scoped('/api/summary')),call(scoped('/api/alerts?limit=1400')),call('/api/replay')]);$('connection').textContent=summary.engine==='c'?'C engine online':'Python engine online';if(selected===null)selected=alerts[0]?.id??replay.focus;await render()}catch(e){fail(e)}}
function stats(){return `<div class="cards">${[[summary.transactions.toLocaleString(),'Observed transactions',''],[summary.on_hold,'Cases held / awaiting review','HOLD'],[summary.watch,'Review band · 60–85','WATCH'],[summary.released,'Unused case releases','CLEAR']].map(([v,l,c])=>`<div class="card"><small>${l}</small><b class="${c}">${v}</b></div>`).join('')}</div>`}
async function render(){nav();detail=null;const root=$('content');if(!summary)return;
 if(page==='Overview'){root.innerHTML=stats()+`<div class="grid"><section class="panel"><h2>From evidence to action</h2><p>Follow the money, explain the risk, and let an analyst review the case.</p><div class="notice">${esc(summary.metrics_note)}</div><div class="row"><button class="btn primary" onclick="go('Alert Queue')">Review alerts</button><button class="btn" onclick="go('Scam Simulator')">Run a scenario</button></div><h3>Top cases</h3>${alerts.slice(0,4).map(a=>`<button class="item" onclick="choose(${a.id})"><div class="row between"><b>${esc(a.label)}</b><span style="color:${color(a.risk)}">${a.risk} · ${a.tier}</span></div><small>${esc(a.region)} · ${esc(a.top_reason)}</small></button>`).join('')}</section><section class="panel"><h2>Flagged cash-out hotspots</h2><small>Retrospective activity by synthetic area; marker size shows flagged volume.</small><div id="hotmap"></div><small>Area schematic • synthetic locations • no map tile service</small></section></div>`;let h=await call(scoped('/api/hotspots'));$('hotmap').innerHTML=mapSvg({nodes:h.map((x,i)=>({...x,id:i,label:x.region,role:'hotspot',risk:60,volume:x.flagged})),edges:[]},true);return}
 if(page==='Alert Queue'||page==='Money Trail'){root.innerHTML=`<div class="cases"><section class="panel"><h2>Investigation queue</h2><input id="search" placeholder="Search wallet or region" value="${esc(search)}" style="width:100%" aria-label="Search alerts"><select id="filter" style="width:100%;margin-top:8px" aria-label="Risk filter">${['ALL','HOLD','WATCH'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><div class="queue" id="queue"></div></section><div id="detail" class="panel"></div></div>`;$('search').oninput=e=>{search=e.target.value;queue()};$('filter').onchange=e=>{filter=e.target.value;queue()};queue();await loadDetail();return}
 if(page==='Scam Simulator'||page==='Live Monitor'){root.innerHTML=`<section class="panel stack"><div class="row between"><div><h2>Transaction replay</h2><small>Isolated demo stream · batch evidence stays separate</small></div><span class="pill">${replay.cursor} / ${replay.total} events</span></div><div class="row"><select id="scenario" aria-label="Scenario">${[['scam','Fast mule ring'],['evasive','Evasive mule ring'],['legitimate','Legitimate transfer'],['dataset','Chronological dataset suffix']].map(([v,l])=>`<option value="${v}" ${v===replay.scenario?'selected':''}>${l}</option>`).join('')}</select><button class="btn" onclick="resetReplay()">Reset / New run</button><button class="btn primary" onclick="stepReplay()" ${replay.done?'disabled':''}>Next transaction</button><button class="btn" onclick="togglePlay()">${playing?'Pause':'Auto play'}</button><button class="btn" onclick="openReplayCase()">Investigate focus wallet</button></div><div class="notice">${esc(replay.model_note)}</div></section>${impact()}<div class="grid"><section class="panel"><h2>Live event feed</h2><div class="scroll"><table><thead><tr><th>Time (BD)</th><th>Trail</th><th>Amount</th><th>Focus risk</th></tr></thead><tbody>${replay.events.slice().reverse().map(e=>`<tr><td>${time(e.ts)}</td><td>W${e.src} → ${e.type==='cash_out'?'AGT':'W'}${e.dst}<br><small>${esc(e.type)} ${e.pre_decision?'· '+esc(e.pre_decision):''}</small></td><td>${tk(e.amount)}</td><td style="color:${color(e.focus_risk)}">${e.focus_risk}</td></tr>`).join('')||'<tr><td colspan="4">Start with Next transaction.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>Current focus evidence</h2><div id="livecase"></div></section></div>`;let d=await call('/api/alerts/'+replay.focus+'?scope=replay');$('livecase').innerHTML=`<div class="row"><span class="score" style="color:${color(d.risk)}">${d.risk}</span><b>${esc(d.label)}</b><span class="pill ${d.tier}">${d.tier}</span></div>${breakdown(d)}<h3>Rule vs combined model</h3><p>Rapid pass-through rule: <b>${d.components.rule?'FIRED':'NOT FIRED'}</b><br>Combined model: <b>${d.tier}</b></p>${graphSvg(d.trail,d.id)}<ul>${d.reasons.map(r=>`<li>${esc(r.text)}</li>`).join('')}</ul>`;return}
 if(page==='Customer View'){root.innerHTML=`<div class="grid"><section class="panel"><h2>Sender protection preview</h2><p>A simple warning before a risky or unfamiliar transfer. This preview sends no money.</p><ul><li>Checks existing recipient risk.</li><li>Warns on a large transfer to a new recipient.</li><li>Offers a clear review or cancel path.</li></ul><div class="notice">Low risk is not a guarantee. This is an advisory demo, not customer authentication.</div></section><div class="phone"><div class="brand">upay <span style="color:var(--blue)">wallet</span></div><h3>Send money</h3><div class="field"><label for="sender">Sender wallet ID</label><input id="sender" type="number" min="0" value="${replay.victim}"></div><div class="field"><label for="recipient">Recipient wallet ID</label><input id="recipient" type="number" min="0" value="${selected??replay.focus}"></div><div class="field"><label for="sendamt">Amount (৳)</label><input id="sendamt" type="number" min="1" max="1000000" value="57000"></div><button class="btn primary" style="width:100%" onclick="senderCheck()">Review transfer</button><div id="senderResult"></div></div></div>`;return}
 if(page==='Audit Log'){let rows=await call(scoped('/api/audit'));root.innerHTML=`<section class="panel"><div class="row between"><h2>Persistent audit history</h2><button class="btn" onclick="exportAudit()">Export JSON</button></div><small>Latest 1,000 events in the selected scope. Demo resets preserve previous runs in SQLite.</small><div class="scroll"><table><thead><tr><th>Time (BD)</th><th>Case</th><th>Action</th><th>Analyst</th><th>Outcome / Note</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(fulltime(r.at))}</td><td>${esc(r.case_id)}</td><td>${esc(r.action)}</td><td>${esc(r.analyst)}</td><td>${esc(r.outcome)}<br>${esc(r.note)}</td></tr>`).join('')||'<tr><td colspan="5">No actions recorded yet.</td></tr>'}</tbody></table></div></section>`;return}
 if(page==='Evidence'){const m=summary.metrics;root.innerHTML=`<div class="notice">${esc(summary.metrics_note)} Account holdout is not an isolated network holdout: connected transactions can cross account splits.</div><div class="grid"><section class="panel"><h2>Method comparison · synthetic data</h2><table><thead><tr><th>Method</th><th>Precision</th><th>Recall</th><th>False alerts</th></tr></thead><tbody>${[['Rapid rule',m.rule_only],['Anomaly only',m.anomaly_only],['Sentinel hold ≥85',m.sentinel],['Sentinel review ≥60',m.sentinel_watch_or_above]].map(([n,v])=>`<tr><td>${n}</td><td>${pct(v.precision)}</td><td>${pct(v.recall)}</td><td>${v.fp}</td></tr>`).join('')}</tbody></table><p><small>${m.holdout_accounts} held-out accounts; ${m.holdout_mules} labeled mules. Labels are evaluation-only. Region and age are not scoring inputs.</small></p></section><section class="panel"><h2>Fairness diagnostics</h2><table><thead><tr><th>Group</th><th>Accounts</th><th>Flag rate</th><th>False positive rate</th></tr></thead><tbody>${[...summary.fairness.region,...summary.fairness.age_band].map(g=>`<tr><td>${esc(g.group)}</td><td>${g.accounts}</td><td>${pct(g.flag_rate)}</td><td>${pct(g.false_positive_rate)}</td></tr>`).join('')}</tbody></table><small>Group results reflect synthetic generation assumptions and do not establish real-world fairness.</small></section></div>`}
}
function go(p){stop();page=p;render().catch(fail)}
function queue(){const q=alerts.filter(a=>(filter==='ALL'||a.tier===filter)&&(`${a.label} ${a.id} ${a.region}`.toLowerCase().includes(search.toLowerCase())));$('queue').innerHTML=q.map(a=>`<button class="item ${a.id===selected?'selected':''}" onclick="selectCase(${a.id})"><div class="row between"><b>${esc(a.label)}</b><span class="${a.tier}">${a.risk}</span></div><div class="line"><span style="width:${a.risk}%;background:${color(a.risk)}"></span></div><small>${esc(a.region)} · ${esc(a.status.replaceAll('_',' '))}</small></button>`).join('')||'<div class="empty">No matching alerts.</div>'}
function choose(i){selected=i;go('Alert Queue')}function selectCase(i){selected=i;queue();loadDetail().catch(fail)}
function breakdown(d){const c=d.contributions;return `<h3>Risk contributions · points out of 100</h3><div class="contrib"><span style="width:${c.graph}%;background:var(--blue)"></span><span style="width:${c.anomaly}%;background:#8d6de9"></span><span style="width:${c.rule}%;background:var(--yellow)"></span></div><small>Graph ${c.graph.toFixed(1)} / 40 · Behaviour ${c.anomaly.toFixed(1)} / 40 · Rule ${c.rule.toFixed(1)} / 20</small><p><small>Contribution breakdown, not a fraud probability. Location evidence does not change the score.</small></p>`}
async function loadDetail(){if(selected===null){$('detail').innerHTML='<div class="empty">Select a wallet.</div>';return}detail=await call(scoped('/api/alerts/'+selected));const d=detail;$('detail').innerHTML=`<div class="row between"><div class="row"><span class="score" style="color:${color(d.risk)}">${d.risk}</span><div><h2 style="margin:0">${esc(d.label)}</h2><small>${esc(d.location.area)} · ${esc(d.status.replaceAll('_',' '))}</small></div><span class="pill ${d.tier}">${d.tier}</span></div><button class="btn" onclick="exportCase()">Export evidence</button></div>${breakdown(d)}<div class="row between"><h3>Money trail · 30-minute window</h3><div class="tabs"><button class="btn ${trailMode==='graph'?'active':''}" onclick="setTrail('graph')">Graph</button><button class="btn ${trailMode==='map'?'active':''}" onclick="setTrail('map')">Map</button></div></div><div id="trail"></div><div class="legend"><span><i style="background:var(--blue)"></i>Sender / wallet</span><span><i style="background:var(--yellow)"></i>Focus</span><span><i style="background:var(--red)"></i>Agent</span></div><small>${esc(d.location_note)}</small><div id="agentinfo"></div><h3>What happened</h3><p>${esc(d.narrative.what)}</p><h3>Why it is risky</h3><ul>${d.reasons.map(r=>`<li><b>${esc(r.code)}</b> — ${esc(r.text)}</li>`).join('')||'<li>No strong risk signals.</li>'}</ul><h3>Next action</h3><ul>${d.narrative.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="notice">Face verification is a simulated request. Release authorizes one subsequent cash-out check for this unchanged case; new transaction evidence creates a new case.</div><h3>Transaction timeline · Bangladesh time</h3><div class="timeline">${d.timeline.map(e=>`<div class="event"><small>${time(e.ts)}</small> · W${e.src} → ${e.type==='cash_out'?'AGT':'W'}${e.dst} · <b>${tk(e.amount)}</b> · ${esc(e.type)}</div>`).join('')}</div><h3>Analyst decision</h3><div class="row"><input id="analyst" aria-label="Analyst name" placeholder="Analyst name" value="demo-analyst"><select id="outcome" aria-label="Outcome"><option value="">Outcome not set</option><option value="suspicious">Suspicious</option><option value="legitimate">Legitimate</option><option value="insufficient_evidence">Insufficient evidence</option></select></div><textarea id="note" aria-label="Decision note" placeholder="Record the evidence and your decision…" style="margin:10px 0"></textarea><div class="row"><button class="btn primary" onclick="decision('confirm_hold')">Confirm hold</button><button class="btn" onclick="decision('release')">Release once</button><button class="btn danger" onclick="decision('escalate')">Escalate</button></div><h3>Cash-out request preview</h3><div class="row"><input id="cashamt" aria-label="Cash-out amount" type="number" min="1" max="1000000" value="20000"><button class="btn" onclick="checkCash()">Check cash-out</button></div><div id="cashresult"></div><h3>Case history</h3>${d.history.slice(0,8).map(h=>`<div class="event"><small>${esc(fulltime(h.at))}</small> · <b>${esc(h.action)}</b> · ${esc(h.analyst)}<p>${esc(h.note)}</p></div>`).join('')||'<small>No decisions yet.</small>'}`;setTrail(trailMode)}
function setTrail(v){trailMode=v;$('trail').innerHTML='<div class="mapbox">'+(v==='map'?mapSvg(detail.trail):graphSvg(detail.trail,selected))+'</div>';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===v))}
function graphSvg(tr,focus){if(!tr.nodes.length)return '<div class="empty">No incoming transfer to trace.</div>';let layers={};tr.nodes.forEach(n=>(layers[n.depth]??=[]).push(n));let ds=Object.keys(layers).map(Number).sort((a,b)=>a-b),pos={},W=800,H=Math.max(230,...ds.map(d=>layers[d].length*60+40));ds.forEach((d,k)=>layers[d].forEach((n,j)=>pos[n.id]={x:(k+.5)*W/ds.length,y:(j+.5)*H/layers[d].length}));return svgTrail(tr,pos,W,H,focus)}
function svgTrail(tr,pos,W,H,focus,bg=''){return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Interactive money trail">${bg}<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="12" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#7186a8"/></marker></defs>${tr.edges.map(e=>{let a=pos[e.src],b=pos[e.dst];if(!a||!b)return '';return `<g><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#7186a8" stroke-width="2" marker-end="url(#arrow)"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-5}" text-anchor="middle" font-size="10">${tk(e.amount)}</text></g>`}).join('')}${tr.nodes.map(n=>{let p=pos[n.id],r=n.role==='hotspot'?8+Math.min(25,Math.sqrt(n.volume||0)*2):n.id===focus?13:10;return `<g class="node" tabindex="0" role="button" aria-label="${esc(n.label)}" onclick="marker(${n.id},'${n.role}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();marker(${n.id},'${n.role}')}"><title>${esc(n.label)} · ${esc(n.area||n.region||n.role)}${n.volume!==undefined?' · '+n.volume+' flagged':''}</title><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${n.id===focus?'#efb434':n.role==='agent'?'#df465e':'#315bea'}" opacity=".85"/><text x="${p.x}" y="${p.y+r+15}" text-anchor="middle" font-size="11">${esc(n.label)}</text></g>`}).join('')}</svg>`}
function mapSvg(tr,hot=false){let pos={},groups={};tr.nodes.forEach(n=>{let k=n.lat+','+n.lon;(groups[k]??=[]).push(n)});Object.values(groups).forEach(g=>g.forEach((n,i)=>{let x=70+(n.lon-88)*220,y=490-(n.lat-21.8)*95;if(g.length>1){x+=Math.cos(i*2*Math.PI/g.length)*24;y+=Math.sin(i*2*Math.PI/g.length)*24}pos[n.id]={x,y}}));let bg=`<path d="M220 36 L415 65 L450 130 L590 153 L580 240 L660 360 L720 480 L610 440 L520 350 L420 385 L350 460 L275 440 L180 360 L170 280 L95 205 L125 110 Z" fill="var(--soft)" stroke="var(--line)" stroke-width="2"/><text x="20" y="22" font-size="11">Bangladesh area schematic · approximate outline</text>`;return svgTrail(tr,pos,800,540,hot?null:selected,bg)}
async function marker(id,role){try{if(role==='hotspot'){toast('Hotspot markers show flagged cash-outs by region.');return}if(role==='agent'){let a=await call(scoped('/api/agents/'+id));let el=$('agentinfo');if(el)el.innerHTML=`<div class="notice"><b>${esc(a.label)} · ${esc(a.location.area)}</b><p>${a.cashouts} cash-outs · ${a.flagged_cashouts} linked to flagged wallets · ${tk(a.flagged_amount)}</p><small>${esc(a.note)}</small></div>`;else toast(a.label+': '+a.flagged_cashouts+' flagged cash-outs');return}selected=id;if($('detail')){queue();await loadDetail()}else go('Money Trail')}catch(e){fail(e)}}
async function decision(action){try{await call(scoped('/api/alerts/'+selected+'/decision'),{action,analyst:$('analyst').value,note:$('note').value,outcome:$('outcome').value});toast('Decision saved to case history.');await refresh()}catch(e){fail(e)}}
async function checkCash(){try{let r=await call(scoped('/api/check-cashout'),{account_id:selected,amount:Number($('cashamt').value)});await loadDetail();$('cashresult').innerHTML=`<div class="notice ${r.decision==='HOLD_AND_VERIFY'?'warn':''}"><b>${esc(r.decision)}</b><p>${esc(r.message)}</p>${r.release_consumed?'<small>One-use release consumed.</small>':''}</div>`}catch(e){fail(e)}}
function impact(){const m=replay.impact;return `<div class="cards">${[[tk(m.observed_fraud_cashout_requests),'Observed fraud cash-out requests'],[tk(m.paused_before_cashout),'Requests paused using prior evidence'],[m.detection_delay_seconds===null?'—':m.detection_delay_seconds+' s','Focus first reached review band'],[m.legitimate_requests_paused,'Legitimate requests paused']].map(([v,l])=>`<div class="card"><small>${l}</small><b style="font-size:25px">${v}</b></div>`).join('')}</div>`}
async function resetReplay(){try{stop();replay=await call('/api/replay/reset',{scenario:$('scenario').value});scope='replay';$('scope').value=scope;selected=replay.focus;await refresh();toast('New isolated run created. Previous audit history preserved.')}catch(e){fail(e)}}
async function stepReplay(){if(busy)return;busy=true;try{replay=await call('/api/replay/step',{});if(scope!=='replay'){scope='replay';$('scope').value=scope}await refresh();if(replay.done)stop()}catch(e){fail(e)}finally{busy=false}}
function togglePlay(){if(playing){stop();render().catch(fail);return}if(replay.done){toast('Reset the scenario to replay it.');return}playing=true;async function tick(){if(!playing)return;await stepReplay();if(playing&&!replay.done)timer=setTimeout(tick,1500);else{stop();render().catch(fail)}}tick()}
function openReplayCase(){stop();scope='replay';$('scope').value=scope;selected=replay.focus;page='Money Trail';refresh()}
async function senderCheck(){try{let r=await call(scoped('/api/sender-check'),{sender_id:Number($('sender').value),recipient_id:Number($('recipient').value),amount:Number($('sendamt').value)});$('senderResult').innerHTML=`<div class="notice ${r.warning?'warn':''}"><b>${r.warning?'Review before sending':'Check your details'}</b><p>${esc(r.message)}</p><p lang="bn">${esc(r.message_bn)}</p><small>${esc(r.note)}</small></div><div class="row"><button class="btn" onclick="cancelTransfer()">Cancel</button><button class="btn" onclick="toast('Review the recipient identity outside this demo. No money sent.')">Review recipient</button></div>`}catch(e){fail(e)}}
function cancelTransfer(){$('senderResult').innerHTML='<div class="notice">Transfer cancelled. No money was sent.</div>'}
function download(name,data){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCase(){if(detail)download('sentinel-case-'+detail.case_id+'.json',detail)}async function exportAudit(){try{download('sentinel-audit-'+scope+'.json',await call(scoped('/api/audit')))}catch(e){fail(e)}}
$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('sentinel-theme',document.body.classList.contains('dark')?'dark':'light');$('theme').textContent=document.body.classList.contains('dark')?'Day mode':'Night mode'};if(localStorage.getItem('sentinel-theme')==='dark'){document.body.classList.add('dark');$('theme').textContent='Day mode'}$('scope').onchange=()=>{stop();scope=$('scope').value;selected=null;refresh()};refresh();
</script></body></html>

<script>
'use strict';
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), tk=x=>'৳'+Math.round(x||0).toLocaleString('en-IN'), pct=x=>(100*(x||0)).toFixed(1)+'%', time=x=>new Date(x*1000).toLocaleString('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',second:'2-digit'}), fulltime=x=>new Date(x).toLocaleString('en-GB',{timeZone:'Asia/Dhaka'});
const pages=['Overview','Alert Queue','Money Trail','Live Monitor','Scam Simulator','Customer View','Audit Log','Evidence'];
let page='Overview',scope='batch',selected=null,summary=null,alerts=[],detail=null,replay=null,trailMode='graph',filter='ALL',search='',playing=false,timer=null,busy=false;
const params=new URLSearchParams(location.search),api=(params.get('api')||'').replace(/\/$/,''),key=params.get('key')||'';
let activeCalls=0;
async function call(path,body){activeCalls++;$('connection')?.classList.add('is-loading');try{const r=await fetch(api+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(key?{'X-API-Key':key}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}finally{activeCalls--;if(!activeCalls)$('connection')?.classList.remove('is-loading')}}
const scoped=p=>p+(p.includes('?')?'&':'?')+'scope='+scope;
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';$('toast').classList.remove('toast-show');void $('toast').offsetWidth;$('toast').classList.add('toast-show');setTimeout(()=>$('toast').style.display='none',4000)}
function fail(e){$('error').innerHTML='<div class="notice error">'+esc(e.message)+' <button class="btn" onclick="refresh()">Retry</button></div>';stop()}
function color(r){return r>=85?'var(--red)':r>=60?'var(--yellow)':'var(--green)'}
function stop(){playing=false;clearTimeout(timer);timer=null}
const navIcons=['◈','⚑','⇢','◉','▷','▣','≡','◇'];
function nav(){ $('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" data-page="${p}"><span class="nav-icon" aria-hidden="true">${navIcons[pages.indexOf(p)]}</span><span class="nav-label">${p}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{stop();page=b.dataset.page;render().catch(fail)});$('heading').textContent=page;let guide=$('pageguide');if(!guide){guide=document.createElement('p');guide.id='pageguide';guide.className='page-guide';$('content').before(guide)}guide.textContent=({'Overview':'See suspicious activity, then open a case to investigate.','Alert Queue':'Select a wallet → inspect the evidence → record your decision.','Money Trail':'Follow transfers from sender to wallet to cash-out agent. Click a node for details.','Live Monitor':'Step through demo transactions and watch risk change.','Scam Simulator':'Choose a scenario, start a new run, then follow each transaction.','Customer View':'Sign in with the demo PIN → review a transfer → confirm a demo send.','Audit Log':'See saved analyst actions and demo transfer receipts.','Evidence':'Compare detection methods on synthetic data.'})[page];}
async function refresh(){try{$('error').innerHTML='';[summary,alerts,replay]=await Promise.all([call(scoped('/api/summary')),call(scoped('/api/alerts?limit=1400')),call('/api/replay')]);$('connection').textContent=summary.engine==='c'?'C engine online':'Python engine online';if(selected===null)selected=alerts[0]?.id??replay.focus;await render()}catch(e){fail(e)}}
function stats(){return `<div class="cards">${[[summary.transactions.toLocaleString(),'Observed transactions',''],[summary.on_hold,'Cases held / awaiting review','HOLD'],[summary.watch,'Review band · 60–85','WATCH'],[summary.released,'Unused case releases','CLEAR']].map(([v,l,c])=>`<div class="card"><small>${l}</small><b class="${c}">${v}</b></div>`).join('')}</div>`}

 const project=n=>{const lat=Number(n.lat),lon=Number(n.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)){const k=Math.abs(Number(n.id)||0);return{x:150+(k%7)*105,y:160+((k*3)%5)*72}}return{x:100+(lon-minLon)/(maxLon-minLon)*800,y:90+(maxLat-lat)/(maxLat-minLat)*520}};
 const targets={};nodes.forEach(n=>{targets[n.id]=project(n);pos[n.id]={...targets[n.id]}});
 for(let step=0;step<36;step++){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=pos[nodes[i].id],b=pos[nodes[j].id],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<30){const ang=d<.01?(i*2.4+j):Math.atan2(dy,dx),push=(30-d)*.3,cx=Math.cos(ang)*push,cy=Math.sin(ang)*push;a.x-=cx;a.y-=cy;b.x+=cx;b.y+=cy}}for(const n of nodes){const p=pos[n.id],t=targets[n.id];p.x=Math.max(25,Math.min(975,p.x+(t.x-p.x)*.04));p.y=Math.max(70,Math.min(675,p.y+(t.y-p.y)*.04))}}
 const name=id=>nodes.find(n=>n.id===id)?.label??String(id),maxA=Math.max(1,...tr.edges.map(e=>e.amount));
 const edges=tr.edges.map((e,i)=>{const a=pos[e.src],b=pos[e.dst];if(!a||!b)return '';const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),bend=((i%5)-2)*9,cx=(a.x+b.x)/2-dy/d*bend,cy=(a.y+b.y)/2+dx/d*bend;return '<path class="geo-route" d="M'+a.x+','+a.y+' Q'+cx+','+cy+' '+b.x+','+b.y+'" stroke-width="'+(1.2+2.4*e.amount/maxA)+'" marker-end="url(#'+uid+')"><title>'+esc(name(e.src))+' → '+esc(name(e.dst))+' · '+esc(tk(e.amount))+'</title></path>'}).join('');
 const marks=nodes.map(n=>{const p=pos[n.id],c=nodeColor(n),r=n.id===selected?11:7;return '<g class="geo-pin" tabindex="0" role="button" aria-label="Inspect '+esc(n.label)+' in '+esc(n.area||n.region||'synthetic region')+'" onclick="marker('+n.id+',\''+n.role+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();marker('+n.id+',\''+n.role+'\')}" transform="translate('+p.x+' '+p.y+')"><title>'+esc(n.label)+' · '+esc(n.area||n.region||'Synthetic region')+' · Risk '+(n.risk??'n/a')+'</title><circle r="15" fill="'+c+'" opacity=".14"/><circle r="'+r+'" fill="'+c+'" stroke="white" stroke-width="3"/><circle r="2" fill="white"/></g>'}).join('');
 const rows=tr.edges.map(e=>'<div class="geo-transfer"><span>'+esc(name(e.src))+' <b>→</b> '+esc(name(e.dst))+'</span><strong>'+esc(tk(e.amount))+'</strong></div>').join('')||'<p class="muted">No transfers in this window.</p>';
 return '<div class="trail-head"><div><b>Geographic money trail</b><small>Approximate locations · arrows show transfer direction</small></div><div class="trail-tools"><button class="btn" onclick="zoomTrail(-.15)">−</button><button class="btn" onclick="zoomTrail(.15)">+</button><button class="btn" onclick="zoomTrail(0)">Fit</button></div></div><div class="trail-stage geo-stage"><svg class="money-graph geo-map" data-w="'+W+'" data-h="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Geographic locations and directional transfer routes"><defs><marker id="'+uid+'" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#425c80"/></marker></defs><g class="trail-viewport"><rect width="1000" height="700" rx="18" fill="#eef4fb"/><path d="M355 52 L580 70 L625 140 L790 163 L752 275 L865 480 L815 570 L720 538 L670 438 L575 452 L496 548 L387 602 L303 550 L212 443 L188 338 L116 277 L130 177 L228 122 Z" fill="#e3edf8" stroke="#b6c9df" stroke-width="2"/><path d="M245 125 Q365 210 275 310 T330 520 M500 100 Q430 230 550 310 T630 465 M170 380 Q340 330 435 412 T755 340" fill="none" stroke="#c5d7e9" stroke-width="8" opacity=".7"/><path d="M0 185 H1000 M0 360 H1000 M0 535 H1000 M250 60 V650 M500 60 V650 M750 60 V650" stroke="#d4e1ee" stroke-width="1" stroke-dasharray="3 7"/><text x="30" y="36" class="geo-caption">BANGLADESH · SCHEMATIC VIEW</text><g transform="translate(944 38)"><text x="0" y="0" text-anchor="middle" class="geo-caption">N</text><path d="M0 10 L-6 26 L0 22 L6 26 Z" fill="#425c80"/></g>'+edges+marks+'</g></svg></div><div class="geo-legend"><span><i class="geo-dot" style="background:#315bea"></i>Wallet / sender</span><span><i class="geo-dot" style="background:#d6a423"></i>Selected wallet</span><span><i class="geo-dot" style="background:#dd8a38"></i>High risk</span><span><i class="geo-dot" style="background:#df465e"></i>Cash-out agent</span><span class="muted">Click a dot to inspect an account.</span></div><div class="trail-footer">Approximate synthetic city/region points, not street-level tracking. Fit shows the full map and routes.</div><div class="geo-transfers"><h3>Transfer directions &amp; amounts</h3>'+rows+'</div>';
}
async function marker(id,role){try{if(role==='hotspot'){toast('Hotspot markers show flagged cash-outs by region.');return}if(role==='agent'){let a=await call(scoped('/api/agents/'+id));let el=$('agentinfo');if(el)el.innerHTML=`<div class="notice"><b>${esc(a.label)} · ${esc(a.location.area)}</b><p>${a.cashouts} cash-outs · ${a.flagged_cashouts} linked to flagged wallets · ${tk(a.flagged_amount)}</p><small>${esc(a.note)}</small></div>`;else toast(a.label+': '+a.flagged_cashouts+' flagged cash-outs');return}selected=id;if($('detail')){queue();await loadDetail()}else go('Money Trail')}catch(e){fail(e)}}
async function decision(action){try{await call(scoped('/api/alerts/'+selected+'/decision'),{action,analyst:$('analyst').value,note:$('note').value,outcome:$('outcome').value});toast('Decision saved to case history.');await refresh()}catch(e){fail(e)}}
async function checkCash(){try{let r=await call(scoped('/api/check-cashout'),{account_id:selected,amount:Number($('cashamt').value)});await loadDetail();$('cashresult').innerHTML=`<div class="notice ${r.decision==='HOLD_AND_VERIFY'?'warn':''}"><b>${esc(r.decision)}</b><p>${esc(r.message)}</p>${r.release_consumed?'<small>One-use release consumed.</small>':''}</div>`}catch(e){fail(e)}}
function impact(){const m=replay.impact;return `<div class="cards">${[[tk(m.observed_fraud_cashout_requests),'Observed fraud cash-out requests'],[tk(m.paused_before_cashout),'Requests paused using prior evidence'],[m.detection_delay_seconds===null?'—':m.detection_delay_seconds+' s','Focus first reached review band'],[m.legitimate_requests_paused,'Legitimate requests paused']].map(([v,l])=>`<div class="card"><small>${l}</small><b style="font-size:25px">${v}</b></div>`).join('')}</div>`}
async function resetReplay(){try{stop();replay=await call('/api/replay/reset',{scenario:$('scenario').value});scope='replay';$('scope').value=scope;selected=replay.focus;await refresh();toast('New isolated run created. Previous audit history preserved.')}catch(e){fail(e)}}
async function stepReplay(){if(busy)return;busy=true;try{replay=await call('/api/replay/step',{});if(scope!=='replay'){scope='replay';$('scope').value=scope}await refresh();if(replay.done)stop()}catch(e){fail(e)}finally{busy=false}}
function togglePlay(){if(playing){stop();render().catch(fail);return}if(replay.done){toast('Reset the scenario to replay it.');return}playing=true;async function tick(){if(!playing)return;await stepReplay();if(playing&&!replay.done)timer=setTimeout(tick,1500);else{stop();render().catch(fail)}}tick()}
function openReplayCase(){stop();scope='replay';$('scope').value=scope;selected=replay.focus;page='Money Trail';refresh()}
let demoSession=null,loginBusy=false;
function resetDemoLogin(){demoSession=null;pendingTransfer=null;$('transferPane').hidden=true;$('loginPane').hidden=false;$('senderResult').innerHTML='';$('demoPin').value='';demoStatus().catch(fail)}
function authMessage(r){$('authMessage').innerHTML=`<div class="notice ${r.locked?'warn':''}">${r.locked?`Wallet locked. Time remaining: ${Math.floor(r.remaining_seconds/3600)}h ${Math.floor(r.remaining_seconds%3600/60)}m. Try again after the lock expires.`:esc(r.message||`${r.attempts_remaining} PIN attempts remaining.`)}</div>`;$('loginButton').disabled=!!r.locked}
async function demoStatus(){const wallet=Number($('sender').value);const r=await call('/api/demo-auth/status?scope='+scope+'&wallet_id='+wallet);if(page==='Customer View'&&Number($('sender').value)===wallet)authMessage(r)}
async function demoLogin(){if(loginBusy)return;const wallet=Number($('sender').value),pin=$('demoPin').value,requestScope=scope;if(!/^\d{5}$/.test(pin)){toast('Enter a 5-digit demo PIN.');return}loginBusy=true;$('loginButton').disabled=true;try{const r=await call('/api/demo-auth/login?scope='+requestScope,{wallet_id:wallet,pin});if(page!=='Customer View'||scope!==requestScope||Number($('sender').value)!==wallet){if(r.ok)await call('/api/demo-auth/logout',{session_token:r.session_token});return}$('demoPin').value='';authMessage(r);if(r.ok){demoSession={wallet,token:r.session_token};$('loginPane').hidden=true;$('transferPane').hidden=false}}catch(e){fail(e);if($('loginButton'))$('loginButton').disabled=false}finally{loginBusy=false}}
async function demoLogout(){const token=demoSession?.token;try{if(token)await call('/api/demo-auth/logout',{session_token:token})}finally{if(page==='Customer View')resetDemoLogin()}}
let pendingTransfer=null,sendingDemo=false;
async function senderCheck(){try{pendingTransfer=null;if(!demoSession||demoSession.wallet!==Number($('sender').value))throw Error('Sign in with the demo PIN first.');const payload={session_token:demoSession.token,sender_id:Number($('sender').value),recipient_id:Number($('recipient').value),amount:Number($('sendamt').value)},requestScope=scope;let r=await call(scoped('/api/sender-check'),payload);pendingTransfer={...payload,scope:requestScope,request_id:crypto.randomUUID()};$('senderResult').innerHTML=`<div class="notice ${r.warning?'warn':''}"><b>${r.warning?'Pause and verify the recipient':'Ready to review'}</b><p>${esc(r.message)}</p></div><p><b>${tk(payload.amount)}</b> · W${payload.sender_id} → W${payload.recipient_id}</p>${r.warning?'<label><input id="ackwarning" type="checkbox"> I have reviewed this warning.</label>':''}<div class="row"><button class="btn" onclick="cancelTransfer()">Cancel</button><button id="confirmSend" class="btn primary" onclick="sendDemoTransfer()">Confirm demo send</button></div><small>No real money or balance changes.</small>`}catch(e){fail(e)}}
async function sendDemoTransfer(){if(!pendingTransfer||sendingDemo)return;if($('ackwarning')&&!$('ackwarning').checked){toast('Review the warning and tick the box first.');return}if(scope!==pendingTransfer.scope||Number($('sender').value)!==pendingTransfer.sender_id||Number($('recipient').value)!==pendingTransfer.recipient_id||Number($('sendamt').value)!==pendingTransfer.amount){pendingTransfer=null;toast('Transfer details changed. Click Review transfer again.');return}sendingDemo=true;const button=$('confirmSend');button.disabled=true;button.setAttribute('aria-busy','true');try{const r=await call('/api/demo-send?scope='+pendingTransfer.scope,{...pendingTransfer,warning_acknowledged:!!$('ackwarning')?.checked});pendingTransfer=null;$('senderResult').innerHTML=`<div class="receipt"><b>✓ Demo send completed</b><h2>${tk(r.amount)}</h2><p>W${r.sender_id} → W${r.recipient_id}</p><small>Receipt: ${esc(r.receipt_id)}<br>Saved in Audit Log · no real funds moved.</small></div><button class="btn" onclick="go('Audit Log')">View audit receipt</button>`}catch(e){toast(e.message);if(button.isConnected){button.disabled=false;button.removeAttribute('aria-busy')}}finally{sendingDemo=false}}
function cancelTransfer(){pendingTransfer=null;$('senderResult').innerHTML='<div class="notice">Transfer cancelled. No money was sent.</div>'}
function download(name,data){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCase(){if(detail)download('sentinel-case-'+detail.case_id+'.json',detail)}async function exportAudit(){try{download('sentinel-audit-'+scope+'.json',await call(scoped('/api/audit')))}catch(e){fail(e)}}

const motionObserver=new MutationObserver(records=>{for(const record of records){for(const node of record.addedNodes){if(node.nodeType!==1)continue;if(record.target.id==='content'||record.target.id==='detail'||record.target.id==='senderResult'||record.target.id==='agentinfo'){node.classList.add('motion-enter');if(record.target.id==='content')node.querySelectorAll('.cards>.card,.grid>.panel').forEach(el=>el.classList.add('motion-enter'));}}}});
motionObserver.observe($('content'),{childList:true,subtree:true});
document.addEventListener('pointerdown',event=>{const button=event.target.closest?.('button');if(!button||button.disabled||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const rect=button.getBoundingClientRect(),wave=document.createElement('span');wave.className='click-wave';wave.setAttribute('aria-hidden','true');wave.style.setProperty('--wave-x',(event.clientX-rect.left)+'px');wave.style.setProperty('--wave-y',(event.clientY-rect.top)+'px');button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});});

$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('sentinel-theme',document.body.classList.contains('dark')?'dark':'light');$('theme').textContent=document.body.classList.contains('dark')?'Day mode':'Night mode'};if(localStorage.getItem('sentinel-theme')==='dark'){document.body.classList.add('dark');$('theme').textContent='Day mode'}$('scope').onchange=()=>{stop();scope=$('scope').value;selected=null;refresh()};refresh();
</script></body></html>
